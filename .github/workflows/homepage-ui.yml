name: Homepage UI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'content/**'
      - 'scripts/check-content.ts'
      - 'scripts/check-ui.mjs'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/homepage-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-screenshots
          path: test-results/homepage
          if-no-files-found: warn

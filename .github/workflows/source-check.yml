name: Official source integration check
on:
  workflow_dispatch:
    inputs:
      probe_maybank_country:
        description: 'Repeat the rejected public country-page candidate (read-only, one request)'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/source-check.yml'
      - 'scripts/**'
      - 'src/lib/schema.ts'
      - 'src/lib/parsers.ts'
      - 'src/lib/sync.ts'
      - 'tests/fixtures/**'
permissions:
  contents: read
jobs:
  official-sources:
    name: Source health (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [stable, experimental, expanded, hdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install PDF text extractor
        if: matrix.group == 'expanded'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run verify:sources -- ${{ matrix.group }}
        if: matrix.group != 'hdb'
      - run: npm run verify:sources -- hdb --probe-cpf
        if: matrix.group == 'hdb'
      - uses: actions/upload-artifact@v4
        if: always() && matrix.group == 'hdb'
        with:
          name: hdb-http-diagnostics
          path: hdb-diagnostics.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-observations-${{ matrix.group }}
          path: source-check.json
          if-no-files-found: warn
          retention-days: 7

  maybank-diagnostics:
    name: Maybank transport evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run research:maybank
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maybank-transport-evidence
          path: research-output/maybank/report.json
          if-no-files-found: error
          retention-days: 7

  maybank-country-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_maybank_country
    name: Maybank public country-page candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/maybank-diagnostics.ts --country-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maybank-country-candidate
          path: research-output/maybank-country/report.json
          if-no-files-found: error
          retention-days: 7


  maybank-runner-comparison:
    name: Maybank runner comparison (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check same public URL with the existing bounded collector
        run: npm run verify:sources -- experimental
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maybank-runner-${{ matrix.runner }}
          path: source-check.json
          if-no-files-found: warn
          retention-days: 7

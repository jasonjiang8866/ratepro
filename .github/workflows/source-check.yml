name: Official source integration check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/source-check.yml'
      - 'scripts/**'
      - 'src/lib/schema.ts'
      - 'src/lib/parsers.ts'
      - 'src/lib/sync.ts'
      - 'tests/fixtures/**'
permissions:
  contents: read
jobs:
  official-sources:
    name: Source health (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [stable, experimental, expanded, hdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install PDF text extractor
        if: matrix.group == 'expanded'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run verify:sources -- ${{ matrix.group }}
        if: matrix.group != 'hdb'
      - run: npm run verify:sources -- hdb --probe-cpf
        if: matrix.group == 'hdb'
      - uses: actions/upload-artifact@v4
        if: always() && matrix.group == 'hdb'
        with:
          name: hdb-http-diagnostics
          path: hdb-diagnostics.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-source-observations-${{ matrix.group }}
          path: source-check.json
          if-no-files-found: warn
          retention-days: 7

name: Editorial loading
on:
  pull_request:
    paths:
      - 'src/**'
      - 'content/**'
      - 'scripts/build-editorial.ts'
      - 'scripts/benchmark-editorial.ts'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/editorial-loading.yml'
permissions:
  contents: read
jobs:
  production-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:editorial:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-loading-evidence
          path: test-results/editorial
          if-no-files-found: error

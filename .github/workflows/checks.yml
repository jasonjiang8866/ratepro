name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist
          if-no-files-found: error
